<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>User Tracker</title>
	<style>
		body {
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif ;
			background-color: lightblue ;
			display: flex ;
			justify-content: center ;
			align-items: center ;
			height: 100vh ;
			flex-direction: column ;
			text-align: center ;
		}
		h1 {
			font-size: 2rem ;
		}
		span {
			font-weight: bold ;
			color: darkblue; 
		}
		button {
			margin-top: 1rem ;
			padding: 0.5rem 1rem ;
			font-size: 1rem ;
			border: none ;
			background-color: salmon ;
			color: white ;
			cursor: pointer ;
			border-radius: 5px ;
		}
	</style>
</head>
<body>
	<h1 id="greeting"></h1>
	<button id="resetBtn">Reset</button>
	<script>
		let status = document.getElementById('greeting') 
		let btn = document.getElementById('resetBtn') 
		let data = localStorage.getItem('user') 
		if (!data) {
			let name = prompt("Enter Your Name") 
			if (name) {
				localStorage.setItem('user', name) 
			}
		}
		function deleteCookie(name) {
			document.cookie = `${name}= expires=Thu, 01 Jan 1970 00:00:00 UTC  path=/ ` 
		}
		function User(name) {
			this.name = name 
		}
		function Visitor(name, visitCount) {
			User.call(this, name) 
			this.visitCount = visitCount 
		}
		Visitor.prototype = Object.create(User.prototype) 
		Visitor.prototype.constructor = Visitor 
		if (!(Array.prototype.includes)) {
			Array.prototype.includes = function (val) {
				for (let i=0 ;i<this.length;i++) {
					if (val === this[i]) {
						return true 
					}
				}
				return false 
			}
		}
		function setCookie(name, value) {
			let date = new Date() 
			date.setTime(date.getTime() + (7 * 24 * 60 * 60 * 1000)) 
			document.cookie = `${name}=${value}  expires=${date.toUTCString()}  path=/` 
		}
		function getCookie(name) {
			let user_cookie = document.cookie.split('  ') 
			for (let cookie of user_cookie) {
				let [key, val] = cookie.split('=') 
				if (key == name) return val 
			}
			return null 
		}
		function getSuffix(num) {
			if (num > 3) return `${num}th` 
			if (num == 1) return `${num}st` 
			if (num == 2) return `${num}nd` 
			if (num == 3) return `${num}rd` 
		}
		let username = localStorage.getItem('user') 
		let visits = parseInt(getCookie('visitCount')) || 0 
		visits++ 
		setCookie('visitCount', visits) 
		let visitor = new Visitor(username, visits) 
		if (visitor.name) {
			status.innerHTML = `Hello <span>${visitor.name}</span>! This is your <span>${getSuffix(visitor.visitCount)}</span> visit.` 
		}
		btn.addEventListener('click', () => {
			localStorage.removeItem('user') 
			deleteCookie('visitCount') 
			location.reload() 
		}) 
	</script>
</body>
</html>
